<!doctype html><meta charset="utf-8"><title>Acme Cloud — Account</title><script src="../common.js"></script>
<h1>Account</h1><p id="out" role="status"></p>
<script>
let s = JSON.parse(localStorage.getItem("acme.session") || "null"); if (s && Date.now() - s.at > 15 * 60 * 1000) s = null;

</script>
