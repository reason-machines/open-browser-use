<!doctype html><meta charset="utf-8"><title>Fleet registry</title>
<style>body{font-family:system-ui;max-width:760px;margin:30px auto}#vp{height:420px;overflow:auto;border:1px solid #999;position:relative}#spacer{position:relative}.row{position:absolute;left:0;right:0;height:32px;line-height:32px;border-bottom:1px solid #eee;display:grid;grid-template-columns:90px 1fr 90px 90px;padding:0 8px;font-family:monospace}.hdr{display:grid;grid-template-columns:90px 1fr 90px 90px;padding:0 8px;font-weight:700;border:1px solid #999;border-bottom:none}.hdr span{cursor:pointer}</style>
<h1>Fleet registry</h1>
<p>10,000 units. The table is virtualized: only visible rows exist in the page. Click a column header to sort (click again to reverse).</p>
<div class="hdr" role="row"><span role="columnheader" data-k="id">ID</span><span role="columnheader" data-k="name">Name</span><span role="columnheader" data-k="score">Score ↕</span><span role="columnheader" data-k="status">Status</span></div>
<div id="vp" role="grid" aria-rowcount="10000"><div id="spacer"></div></div>
<script>
let seed = 777; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
const words = ["Nova", "Orion", "Vega", "Lyra", "Atlas", "Juno", "Rhea", "Titan"], stats = ["OK", "OK", "OK", "WARN", "ERROR"];
const data = Array.from({ length: 10000 }, (_, i) => ({ id: 100000 + i, name: words[Math.floor(rnd() * 8)] + "-" + (1000 + Math.floor(rnd() * 9000)), score: Math.floor(rnd() * 100000) / 100, status: stats[Math.floor(rnd() * 5)] }));
Object.freeze(data); const view = data.slice();
let sortKey = null, dir = 1;
const vp = document.getElementById("vp"), sp = document.getElementById("spacer"), H = 32;
sp.style.height = data.length * H + "px";
function draw() {
  const first = Math.max(0, Math.floor(vp.scrollTop / H) - 3), last = Math.min(view.length, first + Math.ceil(420 / H) + 6);
  sp.innerHTML = "";
  for (let i = first; i < last; i++) { const r = view[i], d = document.createElement("div"); d.className = "row"; d.setAttribute("role", "row"); d.setAttribute("aria-rowindex", i + 1); d.style.top = i * H + "px"; d.innerHTML = `<span>${r.id}</span><span>${r.name}</span><span>${r.score.toFixed(2)}</span><span>${r.status}</span>`; sp.appendChild(d); }
}
vp.addEventListener("scroll", () => requestAnimationFrame(draw));
document.querySelectorAll("[data-k]").forEach(h => h.onclick = () => { const k = h.dataset.k; dir = sortKey === k ? -dir : (k === "score" ? -1 : 1); sortKey = k; view.sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : a.id - b.id) * dir); vp.scrollTop = 0; draw(); });
draw();
</script>
