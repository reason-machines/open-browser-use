<!doctype html><meta charset="utf-8"><title>Revenue chart</title>
<style>body{font-family:system-ui;max-width:820px;margin:30px auto}#tip{position:absolute;background:#222;color:#fff;padding:4px 8px;border-radius:4px;font-size:13px;display:none;pointer-events:none}</style>
<h1>Monthly revenue 2026</h1><p>Values are only shown in the tooltip when you hover a bar.</p>
<canvas id="c" width="760" height="320" aria-label="Bar chart of monthly revenue"></canvas><div id="tip" role="tooltip"></div>
<script>
const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let seed = 2026; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
const v = M.map(() => Math.round((40 + rnd() * 60) * 1000) / 1000);
v[6] = Math.max(...v) - 0.731; // decoy: July is within 0.731 of the max, so eyeballing bar heights is not enough
const c = document.getElementById("c"), x = c.getContext("2d"), bw = 760 / 12;
M.forEach((m, i) => { const h = v[i] * 2.6; x.fillStyle = "#4a7"; x.fillRect(i * bw + 8, 300 - h, bw - 16, h); x.fillStyle = "#333"; x.fillText(m, i * bw + bw / 2 - 8, 315); });
const tip = document.getElementById("tip");
c.addEventListener("mousemove", e => { const r = c.getBoundingClientRect(), i = Math.floor((e.clientX - r.left) / bw); if (i < 0 || i > 11) return; tip.textContent = `${M[i]}: $${v[i].toFixed(3)}k`; tip.style.left = e.pageX + 12 + "px"; tip.style.top = e.pageY - 10 + "px"; tip.style.display = "block"; });
c.addEventListener("mouseleave", () => tip.style.display = "none");
</script>
