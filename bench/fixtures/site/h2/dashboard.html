<!doctype html><meta charset="utf-8"><title>Acme Cloud — Dashboard</title>
<h1>Dashboard</h1><p id="who"></p><p>Your API secret is shown on the <a href="account.html" target="_blank">Account page</a> (opens in a new tab).</p>
