<!doctype html><meta charset="utf-8"><title>Sort the Cards</title><script src="common.js"></script>
<style>#list{width:260px}.card{padding:12px;margin:6px;border:1px solid #777;background:#f7f7f7;user-select:none;cursor:grab}.card.drag{opacity:.5}</style>
<h1>Sort the Cards</h1>
<p>Drag the cards (mouse drag only; there are no buttons) into <b>alphabetical order</b> top to bottom. A code appears when the order is correct.</p>
<div id="list"></div><p id="out" role="status"></p>
<script>
const order = ["Cherry", "Elder", "Apple", "Date", "Banana"];
const list = document.getElementById("list");
order.forEach(t => { const d = document.createElement("div"); d.className = "card"; d.textContent = t; list.appendChild(d); });
let dragging = null;
list.addEventListener("pointerdown", e => { const c = e.target.closest(".card"); if (!c) return; dragging = c; c.classList.add("drag"); e.preventDefault(); });
addEventListener("pointermove", e => {
  if (!dragging) return;
  const others = [...list.children].filter(c => c !== dragging);
  const after = others.find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
  after ? list.insertBefore(dragging, after) : list.appendChild(dragging);
});
addEventListener("pointerup", () => {
  if (!dragging) return; dragging.classList.remove("drag"); dragging = null;
  const now = [...list.children].map(c => c.textContent);
  const out = document.getElementById("out");
  if (now.join() === [...now].sort().join()) reveal(out, "Sorted! Code: " + benchCode("drag:" + now.join(",")));
  else { out.textContent = ""; out.removeAttribute("data-revealed"); }
});
</script>
