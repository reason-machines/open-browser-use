<!doctype html><meta charset="utf-8"><title>Download fixture</title>
<script src="/config.js"></script><script src="/fx.js"></script>
<h1>Downloads</h1>
<p><a id="dl-link" href="/download/file.txt">Download fixture text (Content-Disposition)</a></p>
<p><a id="dl-named" href="/download/file.txt?name=report-q3.csv&bytes=2048">Download report-q3.csv (2 KB)</a></p>
<p><a id="dl-slow" href="/download/file.txt?name=slow.bin&bytes=65536&ms=1500">Download slow.bin (1.5 s)</a></p>
<p><a id="dl-attr" href="/plain.txt" download="renamed.txt">Download via download attribute</a></p>
<p><button id="dl-blob">Generate blob download</button></p>
<p><button id="dl-js">Download via location assign</button></p>
<ol id="fx-log"></ol>
<script>
const tag = new URLSearchParams(location.search).get("tag") || "default";
document.title = "Download fixture " + tag;
document.getElementById("dl-blob").onclick = () => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["blob payload " + tag + "\n"], { type: "text/plain" }));
  a.download = "blob-" + tag + ".txt"; document.body.appendChild(a); a.click(); a.remove(); __fx.log("blob");
};
document.getElementById("dl-js").onclick = () => { location.assign("/download/file.txt?name=assign-" + tag + ".txt"); };
// Rewrite named links so concurrent tabs download distinguishable files.
for (const a of document.querySelectorAll("a[href^='/download/']")) { const u = new URL(a.href); u.searchParams.set("tag", tag); a.href = u; }
</script>
